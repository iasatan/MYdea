name = "midea-cloud-remote"
main = "worker/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

# Nincs [triggers] / cron szakasz: a Worker csak kézi HTTP kérésre fut.

[vars]
# A GitHub Pages eredete (útvonal nélkül!), pl. https://FELHASZNALO.github.io
ALLOWED_ORIGIN = "https://iasatan.github.io"

# Titokként csak ACCESS_TOKEN és opcionálisan APPLIANCE_ID kerülhet ide `wrangler secret put` segítségével.
# A Midea e-mail, jelszó és régió a készülék localStorage tárhelyéből érkezik minden kérésben.
